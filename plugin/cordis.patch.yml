- insert:
    - id: aoci
      name: '@local/dsh-aoci'
      config:
        # Single-repository compatibility. Set projects to enable session routing.
        repoRoot: 'D:/work/huanghao/aoci-code'
        # projects:
        #   - projectId: loan-information-boot
        #     repoRoot: 'E:/work/huanghao/loan-information-boot'
        #   - projectId: pinrong-online
        #     repoRoot: 'E:/work/huanghao/pinrong-online'
        # Set false to disable the optional pre-write / compaction hooks.
        enableHooks: true
        # Set false to disable the MCP server registration.
        enableMcp: true
        # Optional diagnostic log at D:/work/huanghao/aoci-code/aoci-debug.log.
        debug: true
